name: Update GitHub Streak Stats

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime

          query = '''query($login:String!) { user(login:$login) { contributionsCollection { contributionCalendar { weeks { contributionDays { date contributionCount } } } } } }'''
          payload = json.dumps({"query": query, "variables": {"login": os.environ["GH_USER"]}}).encode()
          req = urllib.request.Request("https://api.github.com/graphql", data=payload, headers={"Authorization": "bearer " + os.environ["GH_TOKEN"], "Content-Type": "application/json", "User-Agent": "github-actions-streak-generator"})
          with urllib.request.urlopen(req) as r:
              data = json.load(r)

          days = []
          for week in data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]:
              days.extend(week["contributionDays"])
          counts = {d["date"]: d["contributionCount"] for d in days}

          today = datetime.date.today()
          current = 0
          d = today
          if counts.get(d.isoformat(), 0) == 0:
              d -= datetime.timedelta(days=1)
          while counts.get(d.isoformat(), 0) > 0:
              current += 1
              d -= datetime.timedelta(days=1)

          longest = 0
          run = 0
          for date in sorted(counts):
              if counts[date] > 0:
                  run += 1
                  longest = max(longest, run)
              else:
                  run = 0

          total = sum(counts.values())
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190"><rect width="520" height="190" rx="12" fill="#1a1b27"/><text x="260" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#70a5fd">GitHub Contribution Streak</text><text x="260" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a9b1d6">@{os.environ['GH_USER']}</text><text x="95" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">{current}</text><text x="95" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a9b1d6">CURRENT STREAK</text><text x="260" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">{longest}</text><text x="260" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a9b1d6">LONGEST STREAK</text><text x="425" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#ffffff">{total}</text><text x="425" y="137" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#a9b1d6">CONTRIBUTIONS</text><text x="260" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#565f89">Generated automatically by GitHub Actions</text></svg>'''

          os.makedirs("profile", exist_ok=True)
          with open("profile/streak.svg", "w", encoding="utf-8") as f:
              f.write(svg)
          PY

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet || git commit -m "Update GitHub streak stats"
          git push
